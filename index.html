<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>goodbye to the future</title><style>
:root{--bg:#070707;--panel:#111;--panel2:#171717;--ink:#f1f1ed;--muted:#aaa;--line:#3d3d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC",STSong,serif;line-height:1.65}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #eee;outline-offset:2px}.gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 25%,#303030,#050505 65%)}.gate-card{width:min(460px,100%);padding:42px 35px;border:1px solid #565656;background:#0a0a0a;box-shadow:0 25px 80px #000}.wordmark{font-family:Arial,sans-serif;font-weight:700;letter-spacing:-.04em}.wordmark i{font-weight:400}.gate h1{font-size:2.3rem;line-height:1.14;font-weight:500;margin:26px 0 10px}.gate p{color:var(--muted);margin:0 0 23px}.field{display:block;font-size:.82rem;color:#bbb}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;background:#151515;border:1px solid #4d4d4d;color:#eee;padding:11px}.auth-main{width:100%;border:0;background:#eee;color:#0a0a0a;padding:12px;margin-top:15px;font-weight:700}.auth-github{width:100%;margin-top:10px;background:transparent;border:1px solid #656565;color:#eee;padding:11px}.or{display:flex;align-items:center;gap:10px;color:#777;font:12px Arial;margin:17px 0}.or:before,.or:after{content:"";height:1px;background:#363636;flex:1}.guest{display:block;margin:20px auto 0;background:none;color:#bbb;border:0;text-decoration:underline}.notice{font:12px Arial;color:#858585;margin-top:18px!important}.shell{max-width:1220px;margin:auto;padding:0 25px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #282828}.top a{color:inherit;text-decoration:none}.top-actions{display:flex;gap:10px;align-items:center}.user{font:13px Arial;color:#bbb}.outline{background:transparent;border:1px solid #777;color:#eee;padding:9px 13px}.hero{min-height:420px;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;border-bottom:1px solid #272727}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000c,transparent 40%,#000c),url('assets/cross-gravestone.png') center 2%/min(380px,48vw) auto no-repeat;opacity:.23;filter:grayscale(1)}.hero-inner{position:relative;z-index:1;max-width:760px;padding:70px 0}.eyebrow{margin:0 0 14px;font:700 11px Arial;letter-spacing:.22em;color:#bbb}.hero h1{font-size:clamp(3rem,7vw,6.4rem);line-height:.95;letter-spacing:-.06em;font-weight:500;margin:0}.hero h1 em{font-style:italic;font-weight:400}.hero p{color:#c5c5c5;font-size:1.1rem;margin:22px auto;max-width:550px}.primary{background:#eee;color:#090909;border:0;padding:12px 18px;font-weight:700}.content{padding:65px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.section-head h2{font-size:clamp(2rem,4vw,3.3rem);line-height:1.1;font-weight:500;margin:0}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid #515151;color:#bdbdbd;background:transparent;padding:7px 11px}.filter.active{background:#eee;color:#080808}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stone{min-height:385px;position:relative;padding:25px;display:flex;flex-direction:column;justify-content:end;overflow:hidden;border:1px solid #555;background:#050505 url('assets/cross-gravestone.png') center 12%/auto 79% no-repeat}.stone:nth-child(2n){background-image:url('assets/arched-gravestone.png')}.stone:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#050505e8 74%);pointer-events:none}.stone>*{position:relative;z-index:1}.stone.has-image{background-size:cover;background-position:center}.badge{align-self:start;font:700 10px Arial;letter-spacing:.12em;border:1px solid #aaa;background:#050505c9;padding:5px 8px}.stone h3{font-size:1.8rem;line-height:1.12;margin:0 0 8px;font-weight:500}.stone p{margin:0;color:#ddd}.meta{display:flex;justify-content:space-between;margin-top:16px;color:#c5c5c5;font:12px Arial}.card-open{position:absolute;inset:0;z-index:2;background:transparent;border:0;color:transparent}.empty{grid-column:1/-1;border:1px dashed #555;padding:45px;text-align:center;color:#aaa}.foot{border-top:1px solid #282828;text-align:center;padding:30px;color:#888;font:12px Arial}dialog{padding:0;border:0;background:#111;color:#eee;width:min(700px,calc(100% - 24px));box-shadow:0 25px 100px #000}dialog::backdrop{background:#000b}.modal{padding:30px}.modal-top{display:flex;justify-content:space-between;gap:15px}.modal h2{font-size:2rem;line-height:1.1;font-weight:500;margin:0}.close{border:0;background:transparent;color:#bbb;font-size:1.6rem}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form .wide{grid-column:1/-1}.form label{font-size:.82rem;color:#bbb}.form input,.form textarea,.form select{display:block;width:100%;padding:10px;margin-top:5px;background:#171717;color:#eee;border:1px solid #4d4d4d}.form textarea{min-height:94px}.styles{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.style{border:1px solid #777;background:#171717;color:#eee;padding:7px 10px}.style.sel{background:#eee;color:#090909}.check{display:flex;align-items:center;gap:8px;margin:17px 0;font-size:.88rem;color:#ddd}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.private-note{color:#aaa;font-size:.8rem}.detail-img{display:block;width:100%;max-height:250px;object-fit:cover;filter:grayscale(1);margin:20px 0}.detail-type{font:700 11px Arial;letter-spacing:.13em;color:#bbb;margin-top:14px}.detail p{white-space:pre-wrap}.tribute{display:flex;justify-content:space-between;border-block:1px solid #383838;padding:14px 0;margin:22px 0}.flower{border:0;background:transparent;color:#eee}.comment{border-bottom:1px solid #333;padding:12px 0}.comment small{color:#aaa;margin-left:8px}.comment-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.comment-form input{margin:0}.anonymous{grid-column:1/-1;display:flex;gap:7px;align-items:center;font-size:.82rem;color:#bbb}.comment-form button{border:0;background:#eee;color:#080808;padding:0 14px}@media(max-width:720px){.shell{padding:0 18px}.top{height:64px}.grid{grid-template-columns:1fr}.section-head{display:block}.filters{margin-top:19px}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}.gate-card{padding:34px 25px}.user{display:none}}
.hero:after{background:linear-gradient(90deg,#000c,transparent 40%,#000c),url('cross-gravestone.png') center 2%/min(380px,48vw) auto no-repeat}.stone{background-color:#000;background-image:url('cross-gravestone.png')}.stone:nth-child(2n){background-image:url('arched-gravestone.png')}.gate[hidden]{display:none}</style></head><body>
<section class="gate" id="gate"><div class="gate-card"><div class="wordmark">goodbye <i>to the future</i></div><h1>先登录，<br>再留下你的碑。</h1><p>注册一个账号，让你以后还能回来看看自己的碑。</p><label class="field">账号<input id="username" type="text" minlength="3" maxlength="24" placeholder="3–24 个字符" autocomplete="username"></label><label class="field" style="margin-top:12px">密码<input id="password" type="password" minlength="6" placeholder="至少 6 位" autocomplete="current-password"></label><button class="auth-main" id="emailLogin">账号登录</button><button class="auth-github" id="emailRegister">注册账号</button><button class="guest" id="guest">以访客身份进入并立碑</button><p class="notice" id="authNotice">访客也可以立碑、献花和留言；清除浏览器数据后无法找回访客身份。</p></div></section>
<div class="shell"><nav class="top"><a class="wordmark" href="#">goodbye <i>to the future</i></a><div class="top-actions"><span class="user" id="userLabel">访客</span><button class="outline" id="loginBtn">登录</button><button class="primary" id="createBtn">＋ 立一块碑</button></div></nav><header class="hero"><div class="hero-inner"><p class="eyebrow">A PLACE FOR WHAT MATTERS</p><h1>献给那些<br><em>仍然重要的事物。</em></h1><p>纪念一个人，一件物，一段记忆，或一个没有实现却仍值得被看见的理想。</p><button class="primary" id="heroCreate">为某件事立碑</button></div></header><main class="content"><div class="section-head"><div><p class="eyebrow">PUBLIC MEMORIALS</p><h2>正在被看见的碑</h2></div><div class="filters" id="filters"><button class="filter active" data-kind="all">全部</button><button class="filter" data-kind="人">人</button><button class="filter" data-kind="物">物</button><button class="filter" data-kind="理想">理想</button><button class="filter" data-kind="记忆">记忆</button><button class="filter" data-kind="其他">其他</button></div></div><div class="grid" id="grid"></div></main><footer class="foot">goodbye to the future · 留下、告别、再向未来走去</footer></div>
<dialog id="createDialog"><form class="modal form" id="createForm"><div class="modal-top wide"><h2>立一块碑</h2><button type="button" class="close" data-close="createDialog">×</button></div><label>纪念对象<input required name="title" maxlength="48" placeholder="例如：我没能抵达的远方"></label><label>对象类型<select name="kind"><option>人</option><option>物</option><option>理想</option><option>记忆</option><option>其他</option></select></label><label class="wide">墓志铭 / 一句话<input name="epitaph" maxlength="100" placeholder="有些告别，是为了让自己继续前行。"></label><label class="wide">故事<textarea name="story" maxlength="2000" placeholder="写下任何你想留住的内容。"></textarea></label><label>墓碑样式<div class="styles" id="styles"><button type="button" class="style sel" data-style="cross">十字碑</button><button type="button" class="style" data-style="arch">拱顶碑</button><button type="button" class="style" data-style="weathered">风化石碑</button></div><input type="hidden" name="style" value="cross"></label><label>照片（可选）<input type="file" id="image" accept="image/png,image/jpeg,image/webp"></label><label class="check wide"><input type="checkbox" name="public" checked>公开展示；其他登录用户可献花和评论</label><p class="private-note wide">私密碑仅对创建者可见。上线后，图片会存入受权限保护的云端。</p><div class="actions wide"><button type="button" class="outline" data-close="createDialog">取消</button><button class="primary">保存这块碑</button></div></form></dialog>
<dialog id="detailDialog"><article class="modal detail" id="detail"></article></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script></body></html>
